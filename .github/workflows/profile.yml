name: Update Profile

on:
  schedule:
    - cron: "17 3 * * *"      # every day
  workflow_dispatch:           # run manually from the Actions tab
  push:
    branches: [main, master]
    paths:
      - ".github/README.template.md"
      - ".github/profile.config.json"
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build README and animated assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python .github/scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile" && git push)
